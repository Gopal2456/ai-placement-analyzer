services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placementai-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placementai-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped